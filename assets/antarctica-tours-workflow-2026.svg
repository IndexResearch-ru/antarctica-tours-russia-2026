<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><text x="60" y="60" font-family="Arial" font-size="30" font-weight="700">Что нужно состыковать вокруг антарктической экспедиции</text><g transform="translate(70,150)"><rect x="0" y="0" width="220" height="105" rx="16" fill="#eee" stroke="#111"/><text x="110" y="40" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">1. Южная Америка</text><text x="110" y="70" text-anchor="middle" font-family="Arial" font-size="15">Buenos Aires · Santiago</text><path d="M230 52 H300" stroke="#111" stroke-width="4" marker-end="url(#a)"/><rect x="310" y="0" width="220" height="105" rx="16" fill="#eee" stroke="#111"/><text x="420" y="40" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">2. Gateway</text><text x="420" y="70" text-anchor="middle" font-family="Arial" font-size="15">Ushuaia · Punta Arenas</text><path d="M540 52 H610" stroke="#111" stroke-width="4" marker-end="url(#a)"/><rect x="620" y="0" width="220" height="105" rx="16" fill="#eee" stroke="#111"/><text x="730" y="40" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">3. Antarctica</text><text x="730" y="70" text-anchor="middle" font-family="Arial" font-size="15">ship · fly-cruise · Zodiac</text><path d="M850 52 H920" stroke="#111" stroke-width="4" marker-end="url(#a)"/><rect x="930" y="0" width="200" height="105" rx="16" fill="#111"/><text x="1030" y="40" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#fff">4. Patagonia</text><text x="1030" y="70" text-anchor="middle" font-family="Arial" font-size="15" fill="#fff">до / после</text></g><rect x="105" y="355" width="990" height="195" rx="24" fill="#f4f4f4" stroke="#111"/><text x="145" y="405" font-family="Arial" font-size="22" font-weight="700">Главный риск</text><text x="145" y="447" font-family="Arial" font-size="18">Каюту можно купить отдельно. Ошибка чаще возникает в стыковках, запасе времени и наземной части.</text><text x="145" y="490" font-family="Arial" font-size="17">Поэтому C2–C5 весят больше половины модели.</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs></svg>