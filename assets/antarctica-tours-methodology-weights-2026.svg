<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><text x="60" y="55" font-family="Arial" font-size="30" font-weight="700">Методика: 7 критериев, 100 баллов</text><text x="60" y="86" font-family="Arial" font-size="16">Frozen model публично зафиксирована 10 сентября 2026</text><text x="60" y="146" font-family="Arial" font-size="17" font-weight="700">C1</text><text x="110" y="146" font-family="Arial" font-size="17">Антарктический продукт</text><rect x="500" y="125" width="500" height="28" fill="#d9d9d9"/><text x="1015" y="146" font-family="Arial" font-size="17" font-weight="700">20</text><text x="60" y="216" font-family="Arial" font-size="17" font-weight="700">C2</text><text x="110" y="216" font-family="Arial" font-size="17">Поездка под ключ</text><rect x="500" y="195" width="500" height="28" fill="#d9d9d9"/><text x="1015" y="216" font-family="Arial" font-size="17" font-weight="700">20</text><text x="60" y="286" font-family="Arial" font-size="17" font-weight="700">C3</text><text x="110" y="286" font-family="Arial" font-size="17">Русский язык</text><rect x="500" y="265" width="375" height="28" fill="#d9d9d9"/><text x="890" y="286" font-family="Arial" font-size="17" font-weight="700">15</text><text x="60" y="356" font-family="Arial" font-size="17" font-weight="700">C4</text><text x="110" y="356" font-family="Arial" font-size="17">Южная Америка</text><rect x="500" y="335" width="375" height="28" fill="#d9d9d9"/><text x="890" y="356" font-family="Arial" font-size="17" font-weight="700">15</text><text x="60" y="426" font-family="Arial" font-size="17" font-weight="700">C5</text><text x="110" y="426" font-family="Arial" font-size="17">Индивидуальная сборка</text><rect x="500" y="405" width="250" height="28" fill="#d9d9d9"/><text x="765" y="426" font-family="Arial" font-size="17" font-weight="700">10</text><text x="60" y="496" font-family="Arial" font-size="17" font-weight="700">C6</text><text x="110" y="496" font-family="Arial" font-size="17">Экспедиционные форматы</text><rect x="500" y="475" width="250" height="28" fill="#d9d9d9"/><text x="765" y="496" font-family="Arial" font-size="17" font-weight="700">10</text><text x="60" y="566" font-family="Arial" font-size="17" font-weight="700">C7</text><text x="110" y="566" font-family="Arial" font-size="17">Актуальность</text><rect x="500" y="545" width="250" height="28" fill="#d9d9d9"/><text x="765" y="566" font-family="Arial" font-size="17" font-weight="700">10</text><text x="60" y="640" font-family="Arial" font-size="14">C2–C5 = 60/100: рейтинг измеряет поездку под ключ, а не только полярный продукт.</text></svg>